<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Buchungstrainer Rechnungswesen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f73'/%3E%3Cpath d='M18 22h28M18 32h20M18 42h24' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --indent:26px;
  --bg:#f5f6f8; --card:#fff; --text:#1d2430; --muted:#5d6778; --line:#e3e6eb;
  --accent:#2f6f73; --accent-soft:#e6f1f1;
  --soll:#2f5fb3; --soll-soft:#eaf0fb; --haben:#a4572a; --haben-soft:#f9eee6;
  --ok:#1f8a4c; --ok-soft:#e5f5eb; --bad:#c2362f; --bad-soft:#fbeaea;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 110px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{padding:16px 14px 14px}
h1{font-size:1.45rem;line-height:1.25;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin-top:2px}
h2{font-size:1.1rem;margin:22px 0 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* Start */
.unit{display:block;padding:0;overflow:hidden}
.unit-head{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:14px 16px 6px;min-height:44px}
.check{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid #c5ccd6;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:.15s}
.unit.sel .check{background:var(--accent);border-color:var(--accent)}
.unit.sel .check::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.unit.sel{outline:2px solid var(--accent);outline-offset:-2px}
.unit-title{flex:1 1 auto;min-width:0;font-weight:650;font-size:1.05rem;line-height:1.3}
.unit-meta{color:var(--muted);font-size:.88rem;margin-top:3px}
.stat{display:inline-block;margin-top:6px;font-size:.82rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}
details.theorie{border-top:0}
details.theorie summary{list-style:none;padding:8px 16px 12px;color:var(--accent);font-weight:600;font-size:.95rem;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px}
details.theorie summary::-webkit-details-marker{display:none}
details.theorie summary::before{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(-45deg);transition:.15s}
details.theorie[open] summary::before{transform:rotate(45deg)}
details.theorie ul{margin:0;padding:0 18px 14px 36px}
details.theorie li{margin:6px 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1rem}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.sticky .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.sticky .btn{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 4px;min-height:44px}
footer.foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:28px}
footer.foot a{color:inherit;text-decoration:underline}

/* Rechtstexte: Menü, Fuß, Hinweis zur Computerstimme */
.unit-foot{flex-wrap:wrap}
.ki-stimme{margin:0;padding:0 16px 8px 16px;font-size:.82rem;line-height:1.4;color:var(--muted);font-weight:500}
.vidbox .ki-stimme{padding:0}
.vidbox .ki-stimme{color:#d7dde3;font-size:.9rem;margin:0 0 8px;flex:none}
/* Übung */
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pill{font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.wir{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:1rem}
.wir b{font-weight:700}
.fall{font-size:1.06rem;margin:12px 0 4px}
.einheit-tag{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.side{margin-top:14px}
.side-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.95rem;letter-spacing:.02em}
.side-h .lbl{display:inline-flex;align-items:center;gap:8px}
.side-h .dot{width:10px;height:10px;border-radius:3px}
.soll .dot{background:var(--soll)} .haben .dot{background:var(--haben)}
.soll .side-h{color:var(--soll)} .haben .side-h{color:var(--haben)}
.brow{display:flex;gap:6px;align-items:stretch;margin-top:8px;padding:6px;border-radius:12px}
.soll .brow{background:var(--soll-soft)} .haben .brow{background:var(--haben-soft)}
.slot{flex:1 1 auto;min-width:0;min-height:52px;height:auto;overflow:visible;white-space:normal;border-radius:10px;border:1.5px dashed #b9c1cc;background:#fff;padding:7px 9px;text-align:left;font-size:.95rem;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.slot.konto{flex:1 1 0}
.slot.betrag{flex:0 0 auto;min-width:98px;max-width:42%;text-align:right;align-items:flex-end;font-variant-numeric:tabular-nums}
.slot.betrag .nr{white-space:nowrap}
.slot.filled{border-style:solid;border-color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.slot .ph{color:#8a94a3}
.slot .nr{display:block;font-weight:700}
.slot .nm{display:block;font-size:.84rem;line-height:1.3;color:var(--muted);overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;padding-bottom:1px}
.rm{flex:0 0 34px;padding:0;border:0;background:transparent;color:#8a94a3;font-size:1.4rem;border-radius:10px}
.add{margin-top:8px;border:1.5px dashed #c5ccd6;background:transparent;border-radius:10px;min-height:44px;width:100%;color:var(--muted);font-weight:600}
.brow.ok{box-shadow:inset 0 0 0 2px var(--ok)} .brow.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.mark{flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.brow.ok .mark{color:var(--ok)} .brow.bad .mark{color:var(--bad)}
.rowhint{font-size:.84rem;margin:4px 4px 0}
.rowhint.bad{color:var(--bad)} .rowhint.ok{color:var(--ok)}
.msg{border-radius:12px;padding:12px 14px;font-weight:600;margin-top:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.info{background:#fff6dc;color:#7a5a00}
.loesung{margin-top:12px}@media (max-width:480px){.loesung{font-size:14px}.loesung .lz{column-gap:6px;padding:8px}}
.lz{display:flex;gap:8px;padding:8px 10px;border-radius:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.lz + .lz{margin-top:4px}
.lz .kt{flex:1;min-width:0;overflow-wrap:break-word}
.lz.s{background:var(--soll-soft)} .lz.h{background:var(--haben-soft);margin-left:var(--indent)}
.lz .bt{font-weight:700;white-space:nowrap}
.erkl{margin-top:12px;background:#f7f8fa;border-radius:12px;padding:12px 14px}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:8px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease,visibility 0s linear .22s;visibility:hidden;max-width:760px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet-bg.open{display:block}
.grip{width:40px;height:5px;border-radius:9px;background:#d5dae1;margin:4px auto 10px}
.sheet h3{margin:0 0 10px;font-size:1.02rem}
.sheet h3 .s{color:var(--soll)} .sheet h3 .h{color:var(--haben)}
.klist{display:flex;flex-direction:column;gap:8px}
.kchip{display:flex;gap:12px;align-items:center;text-align:left;min-height:54px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}
.kchip .nr{font-weight:700;min-width:52px;font-variant-numeric:tabular-nums}
.kchip.cur,.bchip.cur{border-color:var(--accent);background:var(--accent-soft)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bchip{min-height:54px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.sheet .btn{margin-top:12px}
/* Auswertung */
.big{font-size:2.2rem;font-weight:800;letter-spacing:-.02em}
.ubar{display:flex;align-items:center;gap:10px;margin:10px 0}
.ubar .t{flex:1;font-size:.95rem}
.ubar .v{font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
/* Beleg-Rahmen */
.beleg-frame{margin:14px 0 6px;position:relative;overflow:hidden;border-radius:6px}
.beleg-frame .scaler{transform-origin:0 0;width:max-content}
@media (min-width:900px){ .wrap{padding-top:22px} h1{font-size:1.7rem} }

/* nur für ganzseitige Screenshots */
html.shot .sticky{position:static;background:none;border:0;padding:0 14px 20px}
html.shot .wrap{padding-bottom:10px}

/* Haben eingerückt, klassisch "Soll an Haben" */
.side.haben{margin-left:var(--indent)}
.an{flex:0 0 auto;align-self:center;font-size:.85rem;font-style:italic;font-weight:600;color:var(--haben);padding:0 1px}
.lz .an{align-self:baseline}
@media (min-width:600px){ :root{--indent:56px} }

/* Tipps */
:root{--tipp:#9a6b00;--tipp-soft:#fff7e0}
#tipps:not(:empty){margin-top:12px}
.tippmore{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid #f0d58a;background:var(--tipp-soft);color:var(--tipp);font-weight:700;text-align:left}
.tippmore .small{font-weight:500}
details.tipp{background:var(--tipp-soft);border:1px solid #f0d58a;border-radius:12px;margin-bottom:8px;overflow:hidden}
details.tipp summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px;font-weight:700;color:var(--tipp);cursor:pointer}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);transition:.15s}
details.tipp[open] summary::after{transform:rotate(-135deg)}
.tbody{padding:0 14px 12px;font-size:.98rem;overflow-wrap:anywhere}
.tbody p{margin:0 0 6px}
.tbody ul{margin:0;padding-left:20px}
.tbody li{margin:4px 0}
.tbody ul.tkonten{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.tbody ul.tkonten li{background:#fff;border-radius:8px;padding:7px 10px;margin:0}
.bulb{flex:0 0 auto}
.sticky .btn.tippbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--tipp-soft);border-color:#f0d58a;color:var(--tipp);padding:12px 14px}
.sticky .btn.tippbtn:disabled{opacity:.5}

/* Motivation */
.serie{display:flex;justify-content:flex-end;align-items:center;gap:5px;min-height:22px;margin-top:6px;font-size:.85rem;font-weight:600;color:#b4690e}
.serie.leer{min-height:6px}
.lobzeile{display:flex;align-items:center;gap:10px}
.msg.ok .pop{color:var(--ok);flex:0 0 auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.msg .mut{font-weight:500;color:var(--text);margin-top:4px}
.msg p.hinweis{margin:8px 0 0;font-weight:600;line-height:1.4;color:inherit}
.msg p.andere{margin:8px 0 0;font-weight:700;line-height:1.4;color:inherit}
.meilenstein{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:12px;background:#fff4e0;color:#8a4d00;font-weight:700;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.beste{display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px;padding:4px 12px;border-radius:99px;background:#fff4e0;color:#8a4d00;font-weight:600;font-size:.92rem}
#konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#konfetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.7}}
@media (prefers-reduced-motion:reduce){.msg.ok .pop,.meilenstein{animation:none}#konfetti{display:none}}
/* Tagesziel-Meldung (nur in der Sitzung, verschwindet von selbst) */
.zieltoast{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,50,.32)}
.zieltoast-box{display:flex;align-items:center;gap:12px;max-width:min(92vw,440px);padding:18px 16px 18px 22px;border-radius:16px;background:#1d4a4d;color:#fff;box-shadow:0 12px 40px rgba(15,30,40,.35);animation:zielpop .45s cubic-bezier(.2,1.4,.4,1) both}
.zieltoast-txt{margin:0;font-weight:700;font-size:1.2rem;line-height:1.35;color:#fff}
.zieltoast-zu{box-sizing:border-box;flex:0 0 44px;width:44px;height:44px;min-width:44px;min-height:44px;margin:0;padding:0;border:2px solid #fff;border-radius:10px;background:#1d4a4d;color:#fff;font-size:1.4rem;line-height:1;cursor:pointer}
.zieltoast-zu:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes zielpop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.zieltoast-box{animation:none}}
html.bf-ruhig .zieltoast-box{animation:none}
html.bf-kontrast .zieltoast-box{background:#000;color:#fff;border:2px solid #fff}
html.bf-kontrast .zieltoast-zu{background:#000}


/* v8: Feedback-Fenster */
body.fb-offen{overflow:hidden}
.fb-bg{position:fixed;inset:0;z-index:60;background:rgba(20,30,50,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.fb-dlg{position:relative;background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.18)}
@media (min-width:600px){.fb-bg{align-items:center;padding:20px}.fb-dlg{border-radius:18px;padding:22px 24px}}
.fb-dlg h2{margin:0 48px 4px 0;font-size:1.2rem}
.fbx{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;font-size:1.2rem;color:var(--muted);border-radius:10px}
.fbq{border:0;margin:14px 0 0;padding:0;display:block}
.fbq legend,.fbq .lg{font-weight:650;margin-bottom:8px;display:block;padding:0}
.fbsterne{display:flex;gap:4px}
.fbstern{width:48px;height:48px;border:0;background:none;color:#c5ccd6;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.fbstern.on{color:#f0b429}
.fbopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fbfoot{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;font-size:inherit;font-weight:600}
span.fbfoot{color:var(--muted);font-weight:500}
.fbopt{min-height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:.95rem;color:var(--text);padding:6px 4px}
.fbopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fbtext textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:1rem;resize:vertical;min-height:84px}
.fbhint{display:flex;justify-content:flex-end;gap:8px;font-size:.82rem;color:var(--muted);margin-top:4px}
.fbdsgvo{font-size:.8rem;color:var(--muted);margin:10px 0 0;line-height:1.4}
.fbhp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.fbbtns{display:flex;gap:10px;margin-top:14px}
.fbbtns .btn{flex:1}
.fb-dlg button:focus-visible,.fb-dlg textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---------- v9 Motivation: Tagesziel, Rang-Pfad, Abzeichen, Sterne, Ergebnis-Karte ---------- */
.motiv{padding:14px 16px}
.mtop{display:flex;gap:12px;align-items:center}
.mh{font-weight:700;font-size:.95rem}
.ring{position:relative;flex:0 0 56px;width:56px;height:56px}
.ring .rbg{fill:none;stroke:var(--line);stroke-width:6}
.ring .rfg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring.voll .rfg{stroke:var(--ok)}
.rzahl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.rzahl small{font-weight:500;color:var(--muted);font-size:.7rem}
.ring.voll .rzahl{color:var(--ok);font-size:1.2rem}
.folge{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:.85rem;font-weight:600;color:#b4690e}
.folge.null{color:var(--muted);font-weight:400}
.rang{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pfad{position:relative;list-style:none;margin:10px 0 6px;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.pfad::before,.pfad::after{content:"";position:absolute;top:13px;left:10%;height:4px;border-radius:2px;background:var(--line)}
.pfad::before{right:10%}
.pfad::after{width:calc(var(--fuell) * .8);background:var(--accent)}
.stufe{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.stufe .pkt{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:var(--card);border:2px solid #c5ccd6;color:var(--muted)}
.stufe.erreicht .pkt{background:var(--accent);border-color:var(--accent);color:#fff}
.stufe.aktuell .pkt{box-shadow:0 0 0 4px var(--accent-soft)}
.stufe .pn{font-size:.72rem;line-height:1.2;color:var(--muted);overflow-wrap:anywhere;hyphens:manual}
.stufe.erreicht .pn{color:var(--text)}
.stufe.aktuell .pn{font-weight:700;color:var(--accent)}
.abz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.badge{display:flex;gap:6px;align-items:flex-start;padding:7px 8px;border-radius:10px;border:1px dashed #c5ccd6;color:var(--muted);font-size:.8rem;line-height:1.25;min-width:0}
.badge svg{flex:0 0 18px;margin-top:1px}
.badge b{display:block;font-size:.82rem}
.badge small{display:block;font-size:.7rem;overflow-wrap:anywhere}
.badge.an{border:1px solid #f0c36d;background:#fff4e0;color:#8a4d00}
.teilbtn{width:100%;margin-top:12px;min-height:46px;border-color:var(--accent);color:var(--accent)}
.sterne{display:flex;gap:2px;margin-top:6px;color:#d59a12}
.sterne .stern:not(.an){color:#c5ccd6}

d"},{"nummer":"7600","name":"Büromaterial (Büroaufwand, Bürobedarf)"},{"nummer":"7780","name":"Kammerumlage"},{"nummer":"7790","name":"Spesen des Geldverkehrs"},{"nummer":"7792","name":"Provisionen, Gebühren Kredit- und Debitkarten"},{"nummer":"8050","name":"Zinsenerträge aus Bankguthaben"},{"nummer":"8055","name":"Verzugszinsenerträge"},{"nummer":"8310","name":"Zinsenaufwand für Bankkredite"},{"nummer":"8320","name":"Verzugszinsenaufwand"},{"nummer":"8321","name":"Mahnspesen"},{"nummer":"9600","name":"Privat"},{"nummer":"20010","name":"Kammfeder Fitness e.U."},{"nummer":"20020","name":"Atemweide Yoga & Pilates e.U."},{"nummer":"20030","name":"Innquell Möbelmanufaktur GmbH"},{"nummer":"33010","name":"Nadelstrom Elektronik Großhandel GmbH"},{"nummer":"33020","name":"Schallkern Audio GmbH"},{"nummer":"33030","name":"Tauernlogistik Spedition GmbH"},{"nummer":"33040","name":"Wachaustern Transport AG"},{"nummer":"33050","name":"Kammerstapel Großhandel GmbH"}],"einheiten":[{"nr":1,"titel":"Einkauf, Rücksendung","kernsaetze":["Beim Wareneinkauf buchst du im Soll Handelswareneinsatz und Vorsteuer.","Kaufst du auf Ziel, steht im Haben das Konto des Lieferanten – jeder Lieferant hat sein eigenes Konto.","Zahlst du sofort bar, steht im Haben die Kassa statt dem Lieferanten.","Schickst du Ware zurück, dreht sich der Buchungssatz einfach um.","Zahlst du den Lieferanten per Bank: Soll Lieferant, Haben Bank."]},{"nr":2,"titel":"Verkauf, Rücksendung","kernsaetze":["Verkauf auf Ziel: Soll Kundenkonto, Haben Handelswarenerlöse und Umsatzsteuer.","Die Umsatzsteuer schulden wir dem Finanzamt – deshalb steht sie im Haben.","Bei Barverkauf steht im Soll die Kassa statt dem Kunden, das Haben bleibt gleich.","Schickt der Kunde Ware zurück, dreht sich der Verkaufssatz um.","Zahlt der Kunde per Bank: Soll Bank, Haben Kunde.","Nimmt sich der Inhaber Ware privat: Soll Privat, Haben Eigenverbrauch und Umsatzsteuer."]},{"nr":3,"titel":"Bezugskosten","kernsaetze":["Bezugskosten entstehen beim Einkauf, wenn die Ware vom Lieferanten in unser Lager gebracht wird.","Dazu zählen z. B. Fracht, Zoll oder eine Transportversicherung.","Wir zahlen sie, wenn das mit dem Lieferanten so vereinbart ist.","Gebucht wird wie ein Warenkauf: Soll Handelswareneinsatz und Vorsteuer, Haben Lieferant (Spediteur)."]},{"nr":4,"titel":"Versandkosten","kernsaetze":["Versandkosten entstehen beim Verkauf, wenn ein Spediteur oder ein Paketdienst die Ware zum Kunden bringt.","Nicht verwechseln: Bezugskosten beim Einkauf, Versandkosten beim Verkauf.","Spedition: Soll Ausgangsfrachten und Vorsteuer, Haben Spediteur oder Kassa.","Paket über 10 kg: 20 % USt, mit Vorsteuer – auch beim Universaldienstbetreiber.","Paket bis 10 kg beim Universaldienstbetreiber (im Trainer: Raschfracht, fiktiv): steuerfrei nach § 6 Abs. 1 Z 10 lit. b UStG, keine Vorsteuer. Private Paket- und Kurierdienste verrechnen immer 20 %."]},{"nr":5,"titel":"Rabatte","kernsaetze":["Ein Rabatt ist ein Nachlass auf den Listenpreis.","Sofortrabatt steht schon auf der Rechnung – gebucht wird nur das Netto nach Rabatt.","Nachträglicher Rabatt vom Lieferanten: Soll Lieferant, Haben Handelswareneinsatz und Vorsteuer.","Nachträglicher Rabatt an den Kunden: Soll Erlösberichtigungen und Umsatzsteuer, Haben Kunde.","Bleibt die Ware beim Kunden, nimm Erlösberichtigungen; kommt sie zurück, Handelswarenerlöse.","Bei jedem Nachlass wird die Steuer mitkorrigiert."]},{"nr":6,"titel":"Zahlung per Banküberweisung","kernsaetze":["Wird der volle Rechnungsbetrag überwiesen, ist die Rechnung ganz ausgeglichen.","Wir bezahlen einen Lieferanten: Soll Lieferant, Haben Bank.","Ein Kunde bezahlt uns: Soll Bank, Haben Kunde.","Ohne Abzug brauchst du nur zwei Konten. Die Steuer bleibt, wie sie ist."]},{"nr":7,"titel":"Kartenzahlung","kernsaetze":["Zahlt ein Kunde mit Kreditkarte, buchst du statt der Kassa 2880 Forderungen Kreditkartenunternehmen (Debitkarte: 2885).","Kommt das Geld auf die Bank, buchst du Bank und Gebühr an die Kartenforderung.","Die Kartengebühr zahlt der Verkäufer: 7792 Provisionen, Gebühren Kredit- und Debitkarten, dazu Vorsteuer (Vereinfachung wie im Buch).","Zahlen wir mit der Firmen-Kreditkarte, schulden wir das Geld dem Kartenunternehmen: 3180 (Firmen-Debitkarte: 3190).","Mit der Monatsabrechnung buchst du: Verbindlichkeit Kartenunternehmen an Bank."]},{"nr":8,"titel":"Lieferantenskonto","kernsaetze":["Skonto ist ein Nachlass für rasches Zahlen. Er gilt nur, wenn er vereinbart ist und wir in der Frist zahlen.","Du rechnest den Skonto vom Bruttobetrag der Rechnung.","Dann teilst du den Skonto durch 1,20 in Netto und Vorsteuer auf.","Soll: Lieferant mit dem vollen Rechnungsbetrag. Haben: 5880 Lieferantenskonti, 2500 Vorsteuer und Bank.","Die Vorsteuer wird mitkorrigiert, weil die Ware billiger wird."]},{"nr":9,"titel":"Kundenskonto","kernsaetze":["Zahlt ein Kunde in der Frist, darf er den vereinbarten Skonto abziehen.","Du rechnest den Skonto vom Bruttobetrag und teilst ihn durch 1,20 in Netto und Umsatzsteuer auf.","Soll: Bank, 4410 Kundenskonti 20 % und 3500 Umsatzsteuer. Haben: Kunde mit dem vollen Rechnungsbetrag.","Wir bekommen weniger Geld, darum schulden wir auch weniger Umsatzsteuer.","Zahlt der Kunde nach der Frist, gibt es keinen Skonto."]},{"nr":10,"titel":"Verzugszinsen und Mahnspesen","kernsaetze":["Mahnspesen und Verzugszinsen haben keine Umsatzsteuer.","Wir mahnen einen Kunden: Kunde an 4890 Mahnspesenvergütungen.","Ein Lieferant mahnt uns: 8321 Mahnspesen an Lieferant.","Verzugszinsen an einen Kunden: Kunde an 8055 Verzugszinsenerträge.","Verzugszinsen von einem Lieferanten: 8320 Verzugszinsenaufwand an Lieferant."]},{"nr":11,"titel":"Barverkehr mit Banken","kernsaetze":["Bargeld zwischen Kassa und Bank hat zwei Belege: den Kassabeleg und den Bankbeleg (Kontoauszug).","Du buchst jeden Beleg für sich, mit dem Zwischenkonto 2870 Barverkehr mit Banken.","Bareinzahlung: Kassabeleg 2870 an 2700, Bankbeleg 2800 an 2870.","Barbehebung: Kassabeleg 2700 an 2870, Bankbeleg 2870 an 2800.","Sind beide Belege gebucht, ist das Zwischenkonto ausgeglichen."]},{"nr":12,"titel":"Bankabschluss","kernsaetze":["Habenzinsen buchst du brutto: Bank an 8050 Zinsenerträge aus Bankguthaben.","Die Bank behält 25 % KESt ein. Die KESt ist eine Steuer des Inhabers: 9600 Privat an Bank.","Sollzinsen sind Aufwand: 8310 Zinsenaufwand für Bankkredite an Bank.","Bankspesen buchst du auf 7790 Spesen des Geldverkehrs, ohne Vorsteuer.","Jede Zeile des Kontoauszugs bekommt einen eigenen Buchungssatz. Eine Bankabrechnung mit Habenzinsen und KESt buchst du in einem Buchungssatz: Bank und Privat an Zinsenerträge aus Bankguthaben."]},{"nr":13,"titel":"Steuern","kernsaetze":["Betriebssteuern sind Aufwand, zum Beispiel 7100 Grundsteuer und 7780 Kammerumlage.","Privatsteuern zahlt der Inhaber, zum Beispiel die Einkommensteuer. Du buchst sie auf 9600 Privat.","Die Umsatzsteuer ist eine Durchlaufsteuer: Umsatzsteuer − Vorsteuer = Zahllast.","Die Zahllast überweist du an das Finanzamt: 3520 USt-Zahllast an Bank.","Grunderwerbsteuer (3,5 %) ist Teil der Anschaffungskosten. Du buchst sie auf das Grundstückskonto."]},{"nr":14,"titel":"Kfz-Betriebskosten","kernsaetze":["Laufende Kfz-Kosten sind Aufwand: Pkw auf 7320, Lkw auf 7330. Die Abschreibung buchst du extra.","Pkw und Kombi (Benzin, Diesel): keine Vorsteuer. Du buchst den Bruttobetrag als Aufwand.","Ausnahme reiner Elektro-Pkw: In unseren Beispielen wird die Vorsteuer abgezogen.","Lkw: Nettobetrag als Aufwand, Umsatzsteuer auf 2500 Vorsteuer.","Die Versicherung mit motorbezogener Versicherungssteuer hat keine Umsatzsteuer.","Zahlst du mit der Firmen-Debitkarte, steht im Haben 3190 Verbindlichkeiten Debitkarten."]},{"nr":15,"titel":"Kfz-Kauf","kernsaetze":["Beim Kauf buchst du das Fahrzeug auf das Anlagekonto: 0630 Pkw und Kombis, 0640 Lkw.","NoVA und Anmeldekosten gehören zu den Anschaffungskosten.","Auf die NoVA gibt es keine Umsatzsteuer.","Beim Pkw (Benzin, Diesel) gehört auch die Umsatzsteuer zu den Anschaffungskosten.","Lkw und Elektro-Pkw: Nettobetrag auf das Anlagekonto, Umsatzsteuer auf 2500 Vorsteuer."]},{"nr":16,"titel":"Kauf sonstiges Material","kernsaetze":["Sonstiges Material verkaufen wir nicht, wir verbrauchen es selbst im Betrieb.","Beim Kauf buchst du den Nettobetrag gleich als Aufwand: 5340 Verpackungsmaterialverbrauch, 5450 Reinigungsmaterialverbrauch, 7240 Heizölverbrauch, 7280 Heizmaterialverbrauch (feste Brennstoffe), 7600 Büromaterial.","Die Umsatzsteuer auf der Eingangsrechnung buchst du auf 2500 Vorsteuer.","Im Haben steht, wie bezahlt wird: Lieferant (später), 2800 Bank oder 2700 Kassa.","Was wir unverändert weiterverkaufen, ist Handelsware: 5000 Handelswareneinsatz 20 %."],"erklaerschritte":[{"titel":"Verkaufen oder selbst verbrauchen?","text":"Schau zuerst, was gekauft wurde. Verbrauchen wir es selbst im Betrieb (Produktkartons, Reiniger, Heizöl, Kopierpapier), ist es sonstiges Material. Verkaufen wir es unverändert weiter (z. B. Trinkflaschen im Laden), ist es Handelsware: 5000 Handelswareneinsatz 20 %."},{"titel":"Soll: Wohin geht das Geld?","text":"Das Geld geht in den Verbrauch. Buche den Nettobetrag auf das passende Aufwandskonto – nicht auf den Vorrat:\nVerpackung 5340 Verpackungsmaterialverbrauch · Reinigung 5450 Reinigungsmaterialverbrauch · Heizöl 7240 Heizölverbrauch · feste Brennstoffe 7280 Heizmaterialverbrauch (feste Brennstoffe) · Büro 7600 Büromaterial (Büroaufwand, Bürobedarf)."},{"titel":"Soll: Vorsteuer","text":"Die 20 % Umsatzsteuer auf der Rechnung holen wir uns vom Finanzamt zurück. Sie kommt ebenfalls ins Soll auf 2500 Vorsteuer.\nBeispiel: 400,00 netto + 80,00 USt = 480,00 brutto."},{"titel":"Haben: Woher kommt das Geld?","text":"Lies am Beleg ab, wie bezahlt wird: „Zahlbar innerhalb von 30 Tagen“ → Lieferant (z. B. 33050 Kammerstapel Großhandel GmbH), „per Überweisung erhalten“ oder Kontoauszug → 2800 Bank, „Bar bezahlt“ → 2700 Kassa. Ins Haben kommt der Bruttobetrag.\nBeispiel: 5340 Verpackungsmaterialverbrauch 400,00 / 2500 Vorsteuer 80,00 an 33050 Kammerstapel 480,00."}]},{"nr":17,"titel":"Inventur und Bestandsveränderung","kernsaetze":["Bei der Inventur am 31.12. wird gezählt, wie viel Material noch da ist. Das steht in der Inventurliste (Endbestand).","Den Anfangsbestand findest du in der Inventurliste vom Vorjahr: Der Endbestand vom 31.12.2025 ist der Anfangsbestand am 1.1.2026.","Rechne: Endbestand − Anfangsbestand. Plus heißt Vermehrung, minus heißt Verminderung.","Vermehrung: Vorrat an Aufwand (z. B. 1360 Vorrat Heizöl an 7240 Heizölverbrauch).","Verminderung: Aufwand an Vorrat (z. B. 5340 Verpackungsmaterialverbrauch an 1340 Vorrat Verpackungsmaterial).","Gebucht wird nur der Unterschied, nicht der ganze Endbestand."],"erklaerschritte":[{"titel":"Zwei Inventurlisten lesen","text":"Am 31.12. wird gezählt, was noch da ist. Den Anfangsbestand liest du in der Inventurliste vom Vorjahr (31.12.2025) ab, den Endbestand in der Inventurliste von heuer (31.12.2026)."},{"titel":"Rechnen: Endbestand − Anfangsbestand","text":"Ergebnis plus → Vermehrung (der Vorrat ist gewachsen). Ergebnis minus → Verminderung (der Vorrat ist geschrumpft).\nBeispiel: 1.200 − 800 = +400 → Vermehrung. Beispiel: 350 − 600 = −250 → Verminderung."},{"titel":"Soll: Wohin geht der Betrag?","text":"Vermehrung: Der Betrag geht in den Vorrat, denn der wird größer → Vorratskonto ins Soll (z. B. 1360 Vorrat Heizöl).\nVerminderung: Wir haben auch Material aus dem Vorrat verbraucht, der Aufwand wird größer → Aufwandskonto ins Soll (z. B. 5340 Verpackungsmaterialverbrauch)."},{"titel":"Haben: das Gegenkonto","text":"Vermehrung: Vorrat an Aufwand (1360 Vorrat Heizöl an 7240 Heizölverbrauch 400,00) – der Aufwand wird kleiner.\nVerminderung: Aufwand an Vorrat (5340 Verpackungsmaterialverbrauch an 1340 Vorrat Verpackungsmaterial 250,00) – der Vorrat wird kleiner.\nGebucht wird nur der Unterschied, nicht der ganze Endbestand. Es gibt keine Umsatzsteuer, weil nichts gekauft wird."}]}],"aufgaben":[{"id":"E1-01","einheit":1,"wir":"Ohmreich Elektrof /* ===== Lizenz-Modul Buchungstrainer v2 (Schlüssel + Demo-Zähler) =====

  DATA.aufgaben.filter(x => x.einheit === a.einheit).forEach(x => {
    x.loesung.forEach(l => pool.set(l.konto, (pool.get(l.konto) || 0) + 2));
    (x.ablenker || []).forEach(k => pool.set(k, (pool.get(k) || 0) + 1));
  });
  let rest = shuffle([...pool.keys()].filter(k => KONTO[k] && !pflicht.includes(k)));
  if (rest.length < CONFIG.kontenAuswahl - pflicht.length)
    rest = rest.concat(shuffle(Object.keys(KONTO).filter(k => !pflicht.includes(k) && !rest.includes(k))));
  const n = Math.max(0, CONFIG.kontenAuswahl - pflicht.length);
  // Anzeige wie im Kontenplan: Reihenfolge der Konten in inhalte.json (aufsteigend nach Kontonummer)

function betraegeFuer(a) {
  const set = new Map(); const add = v => { if (v > 0) set.set(cents(v), r2(v)); };
  a.loesung.forEach(l => add(l.betrag));
  const re = /(\d{1,3}(?:\.\d{3})*,\d{2})\s*€/g; let m;
  while ((m = re.exec(a.text))) add(parseFloat(m[1].replace(/\./g, "").replace(",", ".")));
  const b = a.beleg;
  if (b) {
    [b.netto, b.ust, b.brutto].forEach(add);
    if (b.nova) add(b.nova.betrag);
    (b.positionen || []).forEach(p => { if (p.betrag != null) add(Math.abs(p.betrag)); });
    if (b.rabatt) { add(b.rabatt.betrag); }
    if (b.rabatt) add((b.positionen || []).reduce((s, p) => s + p.menge * p.einzelpreis, 0));
    if (b.summe || b.endbestand) add((b.summe || b.endbestand).betrag);   // v10 Inventurliste: EB (heuer) und AB (Vorjahr) als naheliegende Fehlbeträge
  }
  if (a.zusatzbeleg && a.zusatzbeleg.summe) add(a.zusatzbeleg.summe.betrag);
  // plausible Falschbeträge
  const echte = new Set(a.loesung.map(l => cents(l.betrag)));
  const max = Math.max(...a.loesung.map(l => l.betrag));
  const sorted = [...new Set(a.loesung.map(l => l.betrag))].sort((x, y) => y - x);
  const basis = sorted[1] || max;
  const kand = [r2(max * 1.2), r2(basis * 0.1), r2(max * 0.2), r2(basis * 0.8)];
  let n = 0;
  for (const k of kand) {
    if (n >= CONFIG.falschBetraege) break;
    if (k > 0 && !set.has(cents(k)) && !echte.has(cents(k))) { add(k); n++; }
  }
  return [...set.values()].sort((x, y) => x - y);
}
