<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Buchungstrainer Rechnungswesen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f73'/%3E%3Cpath d='M18 22h28M18 32h20M18 42h24' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --indent:26px;
  --bg:#f5f6f8; --card:#fff; --text:#1d2430; --muted:#5d6778; --line:#e3e6eb;
  --accent:#2f6f73; --accent-soft:#e6f1f1;
  --soll:#2f5fb3; --soll-soft:#eaf0fb; --haben:#a4572a; --haben-soft:#f9eee6;
  --ok:#1f8a4c; --ok-soft:#e5f5eb; --bad:#c2362f; --bad-soft:#fbeaea;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 110px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{padding:16px 14px 14px}
h1{font-size:1.45rem;line-height:1.25;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin-top:2px}
h2{font-size:1.1rem;margin:22px 0 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* Start */
.unit{display:block;padding:0;overflow:hidden}
.unit-head{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:16px}
.check{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid #c5ccd6;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:.15s}
.unit.sel .check{background:var(--accent);border-color:var(--accent)}
.unit.sel .check::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.unit.sel{outline:2px solid var(--accent);outline-offset:-2px}
.unit-title{font-weight:650;font-size:1.05rem;line-height:1.3}
.unit-meta{color:var(--muted);font-size:.88rem;margin-top:3px}
.stat{display:inline-block;margin-top:6px;font-size:.82rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}
details.theorie{border-top:1px solid var(--line)}
details.theorie summary{list-style:none;padding:12px 16px;color:var(--accent);font-weight:600;font-size:.95rem;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px}
details.theorie summary::-webkit-details-marker{display:none}
details.theorie summary::before{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(-45deg);transition:.15s}
details.theorie[open] summary::before{transform:rotate(45deg)}
details.theorie ul{margin:0;padding:0 18px 14px 36px}
details.theorie li{margin:6px 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1rem}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.sticky .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.sticky .btn{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 4px;min-height:44px}
footer.foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:28px}
/* Übung */
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pill{font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.wir{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:1rem}
.wir b{font-weight:700}
.fall{font-size:1.06rem;margin:12px 0 4px}
.einheit-tag{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.side{margin-top:14px}
.side-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.95rem;letter-spacing:.02em}
.side-h .lbl{display:inline-flex;align-items:center;gap:8px}
.side-h .dot{width:10px;height:10px;border-radius:3px}
.soll .dot{background:var(--soll)} .haben .dot{background:var(--haben)}
.soll .side-h{color:var(--soll)} .haben .side-h{color:var(--haben)}
.brow{display:flex;gap:6px;align-items:stretch;margin-top:8px;padding:6px;border-radius:12px}
.soll .brow{background:var(--soll-soft)} .haben .brow{background:var(--haben-soft)}
.slot{flex:1 1 auto;min-width:0;min-height:52px;height:auto;overflow:visible;white-space:normal;border-radius:10px;border:1.5px dashed #b9c1cc;background:#fff;padding:7px 9px;text-align:left;font-size:.95rem;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.slot.konto{flex:1 1 0}
.slot.betrag{flex:0 0 auto;min-width:98px;max-width:42%;text-align:right;align-items:flex-end;font-variant-numeric:tabular-nums}
.slot.betrag .nr{white-space:nowrap}
.slot.filled{border-style:solid;border-color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.slot .ph{color:#8a94a3}
.slot .nr{display:block;font-weight:700}
.slot .nm{display:block;font-size:.84rem;line-height:1.3;color:var(--muted);overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;padding-bottom:1px}
.rm{flex:0 0 34px;padding:0;border:0;background:transparent;color:#8a94a3;font-size:1.4rem;border-radius:10px}
.add{margin-top:8px;border:1.5px dashed #c5ccd6;background:transparent;border-radius:10px;min-height:44px;width:100%;color:var(--muted);font-weight:600}
.brow.ok{box-shadow:inset 0 0 0 2px var(--ok)} .brow.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.mark{flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.brow.ok .mark{color:var(--ok)} .brow.bad .mark{color:var(--bad)}
.rowhint{font-size:.84rem;margin:4px 4px 0}
.rowhint.bad{color:var(--bad)} .rowhint.ok{color:var(--ok)}
.msg{border-radius:12px;padding:12px 14px;font-weight:600;margin-top:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.info{background:#fff6dc;color:#7a5a00}
.loesung{margin-top:12px}
.lz{display:flex;gap:8px;padding:8px 10px;border-radius:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.lz + .lz{margin-top:4px}
.lz .kt{flex:1;min-width:0;overflow-wrap:anywhere}
.lz.s{background:var(--soll-soft)} .lz.h{background:var(--haben-soft);margin-left:var(--indent)}
.lz .bt{font-weight:700;white-space:nowrap}
.erkl{margin-top:12px;background:#f7f8fa;border-radius:12px;padding:12px 14px}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:8px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease,visibility 0s linear .22s;visibility:hidden;max-width:760px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet-bg.open{display:block}
.grip{width:40px;height:5px;border-radius:9px;background:#d5dae1;margin:4px auto 10px}
.sheet h3{margin:0 0 10px;font-size:1.02rem}
.sheet h3 .s{color:var(--soll)} .sheet h3 .h{color:var(--haben)}
.klist{display:flex;flex-direction:column;gap:8px}
.kchip{display:flex;gap:12px;align-items:center;text-align:left;min-height:54px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}
.kchip .nr{font-weight:700;min-width:52px;font-variant-numeric:tabular-nums}
.kchip.cur,.bchip.cur{border-color:var(--accent);background:var(--accent-soft)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bchip{min-height:54px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.sheet .btn{margin-top:12px}
/* Auswertung */
.big{font-size:2.2rem;font-weight:800;letter-spacing:-.02em}
.ubar{display:flex;align-items:center;gap:10px;margin:10px 0}
.ubar .t{flex:1;font-size:.95rem}
.ubar .v{font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
/* Beleg-Rahmen */
.beleg-frame{margin:14px 0 6px;position:relative;overflow:hidden;border-radius:6px;cursor:zoom-in}
.beleg-frame .scaler{transform-origin:0 0;width:max-content}
.zoomhint{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:4px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(40,44,52,.92);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.open{display:block}
.zoom .zin{padding:60px 14px 30px;width:max-content;margin:0 auto}
.zoom .zclose{position:fixed;top:10px;right:10px;z-index:51;min-height:44px;min-width:44px;border-radius:99px;border:0;background:#fff;font-weight:700;padding:0 16px}
@media (min-width:900px){ .wrap{padding-top:22px} h1{font-size:1.7rem} }

/* nur für ganzseitige Screenshots */
html.shot .sticky{position:static;background:none;border:0;padding:0 14px 20px}
html.shot .wrap{padding-bottom:10px}

/* Haben eingerückt, klassisch "Soll an Haben" */
.side.haben{margin-left:var(--indent)}
.an{flex:0 0 auto;align-self:center;font-size:.85rem;font-style:italic;font-weight:600;color:var(--haben);padding:0 1px}
.lz .an{align-self:baseline}
@media (min-width:600px){ :root{--indent:56px} }

/* Tipps */
:root{--tipp:#9a6b00;--tipp-soft:#fff7e0}
#tipps:not(:empty){margin-top:12px}
.tippmore{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid #f0d58a;background:var(--tipp-soft);color:var(--tipp);font-weight:700;text-align:left}
.tippmore .small{font-weight:500}
details.tipp{background:var(--tipp-soft);border:1px solid #f0d58a;border-radius:12px;margin-bottom:8px;overflow:hidden}
details.tipp summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px;font-weight:700;color:var(--tipp);cursor:pointer}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);transition:.15s}
details.tipp[open] summary::after{transform:rotate(-135deg)}
.tbody{padding:0 14px 12px;font-size:.98rem;overflow-wrap:anywhere}
.tbody p{margin:0 0 6px}
.tbody ul{margin:0;padding-left:20px}
.tbody li{margin:4px 0}
.tbody ul.tkonten{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.tbody ul.tkonten li{background:#fff;border-radius:8px;padding:7px 10px;margin:0}
.bulb{flex:0 0 auto}
.sticky .btn.tippbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--tipp-soft);border-color:#f0d58a;color:var(--tipp);padding:12px 14px}
.sticky .btn.tippbtn:disabled{opacity:.5}

/* Motivation */
.serie{display:flex;justify-content:flex-end;align-items:center;gap:5px;min-height:22px;margin-top:6px;font-size:.85rem;font-weight:600;color:#b4690e}
.serie.leer{min-height:6px}
.lobzeile{display:flex;align-items:center;gap:10px}
.msg.ok .pop{color:var(--ok);flex:0 0 auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.msg .mut{font-weight:500;color:var(--text);margin-top:4px}
.meilenstein{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:12px;background:#fff4e0;color:#8a4d00;font-weight:700;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.beste{display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px;padding:4px 12px;border-radius:99px;background:#fff4e0;color:#8a4d00;font-weight:600;font-size:.92rem}
#konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#konfetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.7}}
@media (prefers-reduced-motion:reduce){.msg.ok .pop,.meilenstein{animation:none}#konfetti{display:none}}

.bl{font-family:"Helvetica Neue",Arial,"Segoe UI",sans-serif;color:#222;background:#fff;font-size:13px;line-height:1.4;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.08)}
.bl table{border-collapse:collapse;width:100%}
.bl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bl .logo img{display:block}
.bl .wm{font-weight:800;font-size:22px;letter-spacing:-.01em}
/* A4-Rechnung / Gutschrift */
.bl.a4{width:560px;padding:28px 28px 22px;border-top:6px solid var(--bc,#444)}
.bl.a4 .kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.bl.a4 .absender{text-align:right;font-size:11.5px;color:#444;line-height:1.45}
.bl.a4 .absender b{color:#111;font-size:12.5px}
.bl.a4 .fenster{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.bl.a4 .ruecksende{font-size:9px;color:#777;border-bottom:1px solid #bbb;padding-bottom:2px;margin-bottom:6px;max-width:290px}
.bl.a4 .empf{font-size:13px;line-height:1.45;min-width:200px}
.bl.a4 .meta td{padding:1px 0 1px 14px;font-size:12px;white-space:nowrap}
.bl.a4 .meta td:first-child{color:#666;padding-left:0}
.bl.a4 h4{font-size:22px;margin:28px 0 4px;font-weight:700;color:var(--bc,#222);letter-spacing:.01em}
.bl.a4 .lead{font-size:12px;color:#555;margin-bottom:12px}
.bl.a4 .pos th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#555;text-align:left;border-bottom:1.5px solid #333;padding:6px 6px}
.bl.a4 .pos td{padding:8px 6px;border-bottom:1px solid #e2e2e2;vertical-align:top}
.bl.a4 .pos th.num{text-align:right}
.bl.a4 .sum{width:280px;margin:12px 0 0 auto}
.bl.a4 .sum td{padding:3px 6px}
.bl.a4 .sum tr.tot td{border-top:1.5px solid #333;font-weight:700;font-size:14.5px;padding-top:7px}
.bl.a4 .zb{margin-top:20px;font-size:12px;padding:9px 12px;background:#f4f4f4;border-left:3px solid var(--bc,#444)}
.bl.a4 .fuss{margin-top:26px;border-top:1px solid #ddd;padding-top:8px;font-size:9.5px;color:#777;display:flex;justify-content:space-between;gap:14px}
/* Kassabeleg (Bon) */
.bl.bon{width:330px;padding:20px 22px 24px;font-family:"Courier New",ui-monospace,Menlo,monospace;font-size:12.5px;background:#fffefb;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% calc(100% + 1px),transparent 98%,#000) 0 0/14px 100% repeat-x}
.bl.bon .c{text-align:center}
.bl.bon .logo{display:flex;justify-content:center;margin-bottom:8px}
.bl.bon .fn{font-weight:700;font-size:13px}
.bl.bon hr{border:0;border-top:1px dashed #888;margin:10px 0}
.bl.bon td{padding:2px 0;vertical-align:top}
.bl.bon .tot td{font-weight:700;font-size:15px;padding-top:6px}
.bl.bon .kl{font-size:11px;color:#555}
.bl.bon .bez{padding-right:8px}
/* Kontoauszug */
.bl.ka{width:560px;padding:26px 30px 22px;border-top:6px solid var(--bc,#1b4f72)}
.bl.ka .kopf{display:flex;justify-content:space-between;align-items:center}
.bl.ka h4{margin:18px 0 2px;font-size:18px}
.bl.ka .info{display:flex;justify-content:space-between;font-size:12px;color:#444;margin:6px 0 14px}
.bl.ka th{font-size:11px;text-transform:uppercase;color:#555;text-align:left;border-bottom:1.5px solid #333;padding:6px}
.bl.ka td{padding:7px 6px;border-bottom:1px solid #e5e5e5}
.bl.ka .neg{color:#b02a2a}
.bl.ka .pos{color:#1e7b3a}
.bl.ka tr.saldo td{color:#555;font-size:12px}
.bl.ka tr.saldo.neu td{font-weight:700;color:#222;border-top:1.5px solid #333;border-bottom:none}
.bl.ka td.num{white-space:nowrap}
.bl.a4 .fuss span{flex:1}
.bl.a4 .fuss span:not(:first-child){white-space:nowrap}
.bl.a4 .fuss span:last-child{text-align:right}

.bl{position:relative}
.bl .stempel{position:absolute;top:10px;right:12px;z-index:2;font:700 17px/1 "Courier New",ui-monospace,monospace;color:#2b4c9b;border:2.5px solid #2b4c9b;border-radius:6px;padding:5px 9px 4px;transform:rotate(-6deg);opacity:.85;background:rgba(255,255,255,.55);letter-spacing:.02em}
.bl.a4 .stempel,.bl.ka .stempel{top:14px;right:16px}
.bl.a4,.bl.ka{padding-top:54px}
.bl.a4 .stempel,.bl.ka .stempel{top:12px;right:18px}
.bl.bon .steuer{margin-top:6px;font-size:11px;color:#444}
.bl.bon .steuer td{padding:1px 0}
.bl.bon .qr{display:flex;justify-content:center;margin-top:10px}
.bl.bon .qr img{width:92px;height:92px;image-rendering:pixelated}
.bl.ka .kinfo{font-size:11.5px;color:#444;margin:6px 0 14px}
.bl.ka .kinfo td{padding:1px 10px 1px 0;border:0;vertical-align:top}
.bl.ka .kinfo td:nth-child(odd){color:#777;white-space:nowrap}
.bl.ka .kinfo td:nth-child(2){white-space:normal}
.bl.ka .kfuss{margin-top:16px;border-top:1px solid #ddd;padding-top:6px;font-size:9.5px;color:#777}

</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="titel">Buchungstrainer Rechnungswesen</h1><div class="sub" id="untertitel"></div></div></header>
<main class="wrap" id="app"><noscript>Bitte JavaScript aktivieren.</noscript></main>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="zoom" id="zoom"><button class="zclose">Schließen ✕</button><div class="zin"></div></div>
<script>
/* =====================================================================
   CONFIG – hier anpassen (z. B. beim Kopieren für eine Parallelklasse)
   ===================================================================== */
const CONFIG = {
  titel: "Buchungstrainer Rechnungswesen",   // Überschrift der Seite
  untertitel: "",                            // optional, z. B. "Handelswaren, Bezugs- und Versandkosten"
  klasse: "",                                // optional, z. B. "2A" – leer lassen = keine Anzeige
  lehrer: "Stefan Masar",                    // wird in der Kopfzeile angezeigt
  fortschrittSpeichern: true,                // Fortschritt nur lokal im Browser (localStorage) merken
  kontenAuswahl: 8,                          // Anzahl Konten-Chips pro Aufgabe (Lösung + Ablenker + weitere)
  falschBetraege: 2                          // Anzahl zusätzlicher plausibler Falschbeträge (1–2)

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = x => Math.round(x * 100) / 100;
const cents = x => Math.round(x * 100);
function eur(x, mitZeichen = true) {
  const neg = x < 0; const c = Math.abs(cents(x));
  const ganz = Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const s = ganz + "," + String(c % 100).padStart(2, "0");
  return (neg ? "−" : "") + s + (mitZeichen ? "\u00a0€" : "");
}
// kein Zeilenumbruch vor "€" und "%" (z. B. "20 %", "2.500,00 €")
const nbsp = s => s.replace(/(\d) (€|%)/g, "$1\u00a0$2");
function menge(x) { return Number.isInteger(x) ? String(x) : String(x).replace(".", ","); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const KONTO = {}; DATA.konten.forEach(k => KONTO[k.nummer] = k.name);
const KONTO_POS = {}; DATA.konten.forEach((k, i) => KONTO_POS[k.nummer] = i);
const kontoSort = (x, y) => (KONTO_POS[x] ?? 1e9) - (KONTO_POS[y] ?? 1e9) || Number(x) - Number(y);
const AUFG = {}; DATA.aufgaben.forEach(a => AUFG[a.id] = a);
const EINHEITEN = DATA.einheiten.slice().sort((a, b) => a.nr - b.nr);

/* ---------- Speicher (nur lokal, kein Tracking) ---------- */
const SKEY = "buchungstrainer:" + (CONFIG.titel + "|" + CONFIG.klasse).toLowerCase();
const store = {
  load() { if (!CONFIG.fortschrittSpeichern) return {}; try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } },
  save(d) { if (!CONFIG.fortschrittSpeichern) return; try { localStorage.setItem(SKEY, JSON.stringify(d)); } catch (e) { } },
  clear() { try { localStorage.removeItem(SKEY); } catch (e) { } }
};
let progress = store.load();
function merke(id, ok) { progress[id] = { ok, t: Date.now() }; store.save(progress); }

/* ---------- Auswahl-Chips ---------- */
function kontenFuer(a) {
  const pflicht = [...new Set(a.loesung.map(l => l.konto).concat(a.ablenker || []))].filter(k => KONTO[k]);
  const pool = new Map();
  DATA.aufgaben.filter(x => x.einheit === a.einheit).forEach(x => {
    x.loesung.forEach(l => pool.set(l.konto, (pool.get(l.konto) || 0) + 2));
    (x.ablenker || []).forEach(k => pool.set(k, (pool.get(k) || 0) + 1));
  });
  let rest = shuffle([...pool.keys()].filter(k => KONTO[k] && !pflicht.includes(k)));
  if (rest.length < CONFIG.kontenAuswahl - pflicht.length)
    rest = rest.concat(shuffle(Object.keys(KONTO).filter(k => !pflicht.includes(k) && !rest.includes(k))));
  const n = Math.max(0, CONFIG.kontenAuswahl - pflicht.length);
  // Anzeige wie im Kontenplan: Reihenfolge der Konten in inhalte.json (aufsteigend nach Kontonummer)
  return pflicht.concat(rest.slice(0, n)).sort(kontoSort);
}
function betraegeFuer(a) {
  const set = new Map(); const add = v => { if (v > 0) set.set(cents(v), r2(v)); };
  a.loesung.forEach(l => add(l.betrag));
  const re = /(\d{1,3}(?:\.\d{3})*,\d{2})\s*€/g; let m;
  while ((m = re.exec(a.text))) add(parseFloat(m[1].replace(/\./g, "").replace(",", ".")));
  const b = a.beleg;
  if (b) {
    [b.netto, b.ust, b.brutto].forEach(add);
    if (b.rabatt) { add(b.rabatt.betrag); }
    const summe = (b.positionen || []).reduce((s, p) => s + p.menge * p.einzelpreis, 0);
    if (b.rabatt) add(summe);
  }
  // plausible Falschbeträge
  const echte = new Set(a.loesung.map(l => cents(l.betrag)));
  const max = Math.max(...a.loesung.map(l => l.betrag));
  const sorted = [...new Set(a.loesung.map(l => l.betrag))].sort((x, y) => y - x);
  const basis = sorted[1] || max;
  const kand = [r2(max * 1.2), r2(basis * 0.1), r2(max * 0.2), r2(basis * 0.8)];
  let n = 0;
  for (const k of kand) {
    if (n >= CONFIG.falschBetraege) break;
    if (k > 0 && !set.has(cents(k)) && !echte.has(cents(k))) { add(k); n++; }
  }
  return [...set.values()].sort((x, y) => x - y);
}

function logoHtml(name, h) {
  const f = FIRMEN[name];
  if (f && f.logo && LOGOS[f.logo]) {
    const lh = Math.round((f.logoH || 40) * (h || 1));
    return `<div class="logo"><img alt="${esc(name)}" src="${LOGOS[f.logo]}" style="height:${lh}px;max-width:${f.logoMaxW || 260}px;object-fit:contain"></div>`;
  }
  const kurz = name.replace(/\s+(GmbH|e\.U\.|AG|Gesellschaft m\.b\.H\.|Aktiengesellschaft)$/, "");
  return `<div class="logo"><div class="wm" style="color:${(f && f.farbe) || "#333"}">${esc(kurz)}</div></div>`;
}

function belegHtml(b, sym) {
  const typ = b.typ || "Rechnung";
  const html = /kassa/i.test(typ) ? bonHtml(b) : /konto/i.test(typ) ? kontoauszugHtml(b) : a4Html(b);
  return sym ? html.replace(/^(<div class="bl [^"]*"[^>]*>)/, `$1<div class="stempel" aria-label="Belegsymbol">${esc(sym)}</div>`) : html;
}
function posRows(b) {
  return (b.positionen || []).map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.bezeichnung)}</td><td class="num">${menge(p.menge)}</td><td class="num">${eur(p.einzelpreis)}</td><td class="num">${eur(p.menge * p.einzelpreis)}</td></tr>`).join("");
}
function a4Html(b) {
  const f = FIRMEN[b.aussteller.name] || {};
  const gs = /gutschrift/i.test(b.typ);
  const titel = gs ? "Gutschrift" : "Rechnung";
  const summe = (b.positionen || []).reduce((s, p) => s + p.menge * p.einzelpreis, 0);
  let sum = "";
  if (b.rabatt) {
    sum += `<tr><td>Summe Positionen</td><td class="num">${eur(summe)}</td></tr>`;
    sum += `<tr><td>− ${menge(b.rabatt.prozent)} % Rabatt</td><td class="num">−${eur(b.rabatt.betrag)}</td></tr>`;
  }
  if (b.skonto) sum += `<tr><td>− ${menge(b.skonto.prozent)} % Skonto</td><td class="num">−${eur(b.skonto.betrag)}</td></tr>`;
  sum += `<tr><td>${gs ? "Gutschrift netto" : "Nettobetrag"}</td><td class="num">${eur(b.netto)}</td></tr>`;
  sum += `<tr><td>${b.ust_satz ? `zuzüglich ${menge(b.ust_satz)} % USt` : "USt 0 %"}</td><td class="num">${eur(b.ust)}</td></tr>`;
  sum += `<tr class="tot"><td>${gs ? "Gutschriftsbetrag" : "Rechnungsbetrag"}</td><td class="num">${eur(b.brutto)}</td></tr>`;
  const e = b.empfaenger || {};
  return `<div class="bl a4" style="--bc:${f.farbe || "#444"}">
  <div class="kopf">${logoHtml(b.aussteller.name)}
    <div class="absender"><b>${esc(b.aussteller.name)}</b><br>${esc(b.aussteller.adresse).replace(/, /, "<br>")}<br>UID: ${esc(b.aussteller.uid)}</div></div>
  <div class="fenster"><div><div class="ruecksende">${esc(b.aussteller.name)} · ${esc(b.aussteller.adresse)}</div>
    <div class="empf">${esc(e.name)}<br>${esc(e.adresse).replace(/, /, "<br>")}${e.uid ? `<br>UID: ${esc(e.uid)}` : ""}</div></div>
    <table class="meta"><tr><td>${titel}snummer</td><td><b>${esc(b.nummer)}</b></td></tr><tr><td>${titel}sdatum</td><td>${esc(b.datum)}</td></tr>${gs ? "" : `<tr><td>Liefer-/Leistungsdatum</td><td>${esc(b.leistungsdatum || b.datum)}</td></tr>`}<tr><td>Seite</td><td>1 von 1</td></tr></table></div>
  <h4>${titel}</h4>
  <div class="lead">${gs ? "Wir schreiben Ihnen folgende Beträge gut:" : "Für unsere Lieferungen und Leistungen erlauben wir uns zu verrechnen:"}</div>
  <table class="pos"><thead><tr><th style="width:34px">Pos.</th><th>Bezeichnung</th><th class="num">Menge</th><th class="num">Einzelpreis</th><th class="num">Gesamt</th></tr></thead><tbody>${posRows(b)}</tbody></table>
  <table class="sum">${sum}</table>
  ${b.zahlungsbedingungen ? `<div class="zb">${esc(b.zahlungsbedingungen)}</div>` : ""}
  <div class="fuss"><span>${esc(b.aussteller.name)}<br>${esc(b.aussteller.adresse)}</span><span>UID: ${esc(b.aussteller.uid)}${f.fn ? `<br>${esc(f.fn)}` : ""}</span>${b.bankverbindung ? `<span>Bankverbindung<br>IBAN ${esc(b.bankverbindung.iban)}</span>` : ""}</div>
</div>`;
}
function bonHtml(b) {

  const k = b.kasse || {};
  const kz = b.ust_satz ? "A" : "D";   // Steuerkennzeichen wie auf Registrierkassen-Belegen
  const rows = (b.positionen || []).map(p => `<tr><td class="bez">${esc(p.bezeichnung)}${p.menge !== 1 ? `<div class="kl">${menge(p.menge)} × ${eur(p.einzelpreis, false)}</div>` : ""}</td><td class="num">${eur(p.menge * p.einzelpreis, false)} ${kz}</td></tr>`).join("");

  <hr><div class="c"><b>KASSABELEG</b></div>
  <table>${k.id ? `<tr><td>Kassen-ID</td><td class="num">${esc(k.id)}</td></tr>` : ""}<tr><td>Beleg-Nr.</td><td class="num">${esc(b.nummer)}</td></tr><tr><td>Datum</td><td class="num">${esc(b.datum)}${k.zeit ? " " + esc(k.zeit) : ""}</td></tr></table>
  ${e.name ? `<div class="kl" style="margin-top:4px">Kunde: ${esc(e.name)}, ${esc(e.adresse)}${b.brutto > 400 && e.uid ? `, UID: ${esc(e.uid)}` : ""}</div>` : ""}
  <hr><table>${rows}</table><hr>
  <table>${b.rabatt ? `<tr><td>Rabatt ${menge(b.rabatt.prozent)} %</td><td class="num">−${eur(b.rabatt.betrag, false)}</td></tr>` : ""}
  <tr class="tot"><td>SUMME EUR</td><td class="num">${eur(b.brutto, false)}</td></tr></table>
  <table class="steuer"><tr><td>Satz</td><td class="num">Netto</td><td class="num">USt</td><td class="num">Brutto</td></tr>
  <tr><td>${kz} ${menge(b.ust_satz)} %</td><td class="num">${eur(b.netto, false)}</td><td class="num">${eur(b.ust, false)}</td><td class="num">${eur(b.brutto, false)}</td></tr></table>
  <hr><div class="c">${esc(b.zahlungsbedingungen || "Bar bezahlt")}</div>
  ${qr ? `<div class="qr"><img alt="QR-Code" src="${qr}"></div>` : ""}
  <div class="c kl" style="margin-top:6px">Vielen Dank!${f.fn ? `<br>${esc(f.fn)}` : ""}</div>

function kontoauszugHtml(b) {
  const f = FIRMEN[b.aussteller.name] || {};
  const e = b.empfaenger || {}; const k = b.konto || {};
  const rows = (b.positionen || []).map(p => { const v = p.betrag != null ? p.betrag : p.menge * p.einzelpreis;

  <table><thead><tr><th>Buchung</th><th>Buchungstext</th><th>Valuta</th><th class="num" style="text-align:right">Betrag</th></tr></thead><tbody>${b.saldo_alt != null ? `<tr class="saldo"><td></td><td>Alter Kontostand</td><td></td><td class="num">${eur(b.saldo_alt)}</td></tr>` : ""}${rows}${b.saldo_neu != null ? `<tr class="saldo neu"><td></td><td>Neuer Kontostand</td><td></td><td class="num">${eur(b.saldo_neu)}</td></tr>` : ""}</tbody></table>
  ${b.zahlungsbedingungen ? `<div style="margin-top:12px;font-size:12px;color:#555">${esc(b.zahlungsbedingungen)}</div>` : ""}
  <div class="kfuss">${esc(b.aussteller.name)} · Sitz Wien${f.fn ? " · " + esc(f.fn) : ""} · BIC ${esc(k.bic || "")}</div>

function fitBelege() {
  document.querySelectorAll(".beleg-frame").forEach(fr => {
    const sc = fr.querySelector(".scaler"); if (!sc) return;
    sc.style.transform = "none";
    const w = sc.scrollWidth, h = sc.scrollHeight, avail = fr.clientWidth;
    const s = Math.min(1, avail / w);
    sc.style.transform = `scale(${s})`;
    fr.style.height = Math.ceil(h * s) + "px";
    if (s >= 1) sc.style.margin = "0 auto"; 
  });
}
window.addEventListener("resize", fitBelege);
function zoomBeleg(html) {
  const z = $("#zoom"); $("#zoom .zin").innerHTML = html; z.classList.add("open"); z.scrollTop = 0;
}

/* ---------- Zustand ---------- */
/* Auswahl der Einheiten: Standard nur Einheit 1; eine gespeicherte Auswahl gilt weiter */
const AKEY = SKEY + ":auswahl";
function ladeAuswahl() {
  try {
    const v = CONFIG.fortschrittSpeichern ? JSON.parse(localStorage.getItem(AKEY)) : null;
    if (Array.isArray(v)) { const ok = v.filter(n => EINHEITEN.some(e => e.nr === n)); return new Set(ok); }
  } catch (e) { }
  return new Set([EINHEITEN[0].nr]);
}
function speichereAuswahl() { if (!CONFIG.fortschrittSpeichern) return; try { localStorage.setItem(AKEY, JSON.stringify([...S.auswahl])); } catch (e) { } }
const S = { auswahl: ladeAuswahl(), queue: [], idx: 0, ergebnisse: [], cur: null, serie: 0, besteSerie: 0 };
const app = () => $("#app");

/* ---------- Startseite ---------- */
function renderStart() {
  window.scrollTo(0, 0);
  speichereAuswahl();
  const anz = S => DATA.aufgaben.filter(a => S.has(a.einheit)).length;
  let h = `<h2>Was möchtest du üben?</h2>`;
  EINHEITEN.forEach(e => {
    const auf = DATA.aufgaben.filter(a => a.einheit === e.nr);
    const bel = auf.filter(a => a.beleg).length;
    const gemacht = auf.filter(a => progress[a.id]);
    const ok = gemacht.filter(a => progress[a.id].ok).length;
    h += `<div class="card unit ${S.auswahl.has(e.nr) ? "sel" : ""}" data-unit="${e.nr}">
      <button class="unit-head" data-toggle="${e.nr}" aria-pressed="${S.auswahl.has(e.nr)}"><span class="check"></span>
        <span><div class="unit-title">Einheit ${e.nr}: ${esc(e.titel)}</div>
        <div class="unit-meta">${auf.length} Aufgaben · davon ${bel} mit Beleg</div>
        ${gemacht.length ? `<span class="stat">zuletzt richtig: ${ok} von ${auf.length}</span>` : ""}</span></button>
      <details class="theorie"><summary>Theorie</summary><ul>${e.kernsaetze.map(k => `<li>${esc(k)}</li>`).join("")}</ul></details>
    </div>`;
  });
  h += `<div class="row-btns" style="margin-top:6px"><button class="linkbtn" id="alle">Alle auswählen</button><button class="linkbtn" id="keine">Keine</button>
        ${Object.keys(progress).length ? `<button class="linkbtn" id="reset" style="margin-left:auto;color:var(--muted)">Fortschritt löschen</button>` : ""}</div>
    <div class="card small muted">So geht's: Lies den Geschäftsfall oder Beleg. Tippe dann im <b style="color:var(--soll)">Soll</b> und im <b style="color:var(--haben)">Haben</b> auf die Felder und wähle Konto und Betrag. Mit <b>+ Zeile</b> fügst du weitere Zeilen hinzu.</div>
    <footer class="foot">${esc(CONFIG.titel)}${CONFIG.lehrer ? " · " + esc(CONFIG.lehrer) : ""}<br>Kontenplan: ${esc(DATA.kontenplan.replace(/_/g, " "))} · Keine Anmeldung, keine Namen, kein Tracking${CONFIG.fortschrittSpeichern ? " – Fortschritt bleibt nur auf diesem Gerät" : ""}.</footer>`;
  const n = anz(S.auswahl);
  h += `<div class="sticky"><div class="inner"><button class="btn primary" id="start" ${n ? "" : "disabled"}>${n ? (S.auswahl.size > 1 ? `Starten (${n} Aufgaben gemischt)` : `Starten (${n} Aufgaben)`) : "Bitte Einheit wählen"}</button></div></div>`;
  app().innerHTML = h;
  app().querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { const nr = +b.dataset.toggle; S.auswahl.has(nr) ? S.auswahl.delete(nr) : S.auswahl.add(nr); renderStart(); restoreScroll(); });
  $("#alle").onclick = () => { EINHEITEN.forEach(e => S.auswahl.add(e.nr)); renderStart(); restoreScroll(); };
  $("#keine").onclick = () => { S.auswahl.clear(); renderStart(); restoreScroll(); };
  const rs = $("#reset"); if (rs) rs.onclick = () => { if (confirm("Gespeicherten Fortschritt auf diesem Gerät löschen?")) { store.clear(); progress = {}; renderStart(); } };
  $("#start").onclick = () => starte(DATA.aufgaben.filter(a => S.auswahl.has(a.einheit)).map(a => a.id));
}
let lastY = 0;
function restoreScroll() { window.scrollTo(0, lastY); }
window.addEventListener("scroll", () => { if ($("#start")) lastY = window.scrollY; }, { passive: true });

function starte(ids) {
  S.queue = shuffle(ids); S.idx = 0; S.ergebnisse = []; S.serie = 0; S.besteSerie = 0;
  renderAufgabe();
}

/* ---------- Aufgabe ---------- */
function neueZeile() { return { konto: null, betrag: null }; }
function renderAufgabe() {
  const a = AUFG[S.queue[S.idx]];
  S.cur = { a, rows: { Soll: [neueZeile()], Haben: [neueZeile()] }, konten: kontenFuer(a), betraege: betraegeFuer(a), geprueft: false, res: null, tipps: 0, tippZu: {} };
  window.scrollTo(0, 0);
  drawAufgabe();
}
function drawAufgabe() {
  const c = S.cur, a = c.a, e = EINHEITEN.find(x => x.nr === a.einheit);
  const punkte = S.ergebnisse.reduce((s, r) => s + r.punkte, 0);
  let h = `<div class="bar" style="margin-top:4px"><button class="linkbtn" id="ende">✕ Beenden</button>
      <span class="pill">Aufgabe ${S.idx + 1} von ${S.queue.length}</span><span class="pill" id="punkte" title="Punkte">${punkteTxt(punkte)} P.</span></div>
    <div class="progress"><i style="width:${(S.idx / S.queue.length) * 100}%"></i></div>
    <div class="serie ${S.serie ? "" : "leer"}" id="serie" data-serie="${S.serie}">${S.serie ? `${FLAMME}<span>${S.serie} richtig in Folge</span>` : ""}</div>
    <div class="card" id="aufgabe" data-id="${esc(a.id)}">
      <div class="einheit-tag">Einheit ${a.einheit} · ${esc(e ? e.titel : "")}</div>
      <div class="wir" style="margin-top:8px">Wir sind: <b>${esc(a.wir)}</b></div>
      <div class="fall">${nbsp(esc(a.text))}</div>
      ${a.beleg ? `<div class="beleg-frame" id="belegframe" role="button" aria-label="Beleg vergrößern"><div class="scaler">${belegHtml(a.beleg, belegSymbol(a.text))}</div></div><div class="zoomhint">Beleg antippen zum Vergrößern</div>` : ""}
      <div id="tipps">${tippHtml()}</div>
    </div>
    <div class="card" id="buchung"><div style="font-weight:700">Dein Buchungssatz</div>
      ${seiteHtml("Soll")}${seiteHtml("Haben")}
      <div id="fb"></div>
    </div>`;
  h += `<div class="sticky"><div class="inner">${c.geprueft
      ? `<button class="btn primary" id="weiter">${S.idx + 1 < S.queue.length ? "Weiter" : "Zur Auswertung"}</button>`
      : `<button class="btn tippbtn" data-tipp ${c.tipps >= 3 ? "disabled" : ""} aria-label="Tipp anzeigen">${BULB}<span>${c.tipps === 0 ? "Tipp" : c.tipps < 3 ? "Tipp " + (c.tipps + 1) : "Tipps"}</span></button><button class="btn primary" id="pruefen" ${bereit() ? "" : "disabled"}>Prüfen</button>`}</div></div>`;
  app().innerHTML = h;
  if (c.geprueft) $("#fb").innerHTML = feedbackHtml();
  bindAufgabe();
  fitBelege();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBelege);
  app().querySelectorAll(".beleg-frame img").forEach(img => img.addEventListener("load", fitBelege));
}
function seiteHtml(seite) {
  const c = S.cur, cls = seite === "Soll" ? "soll" : "haben";
  const rows = c.rows[seite].map((r, i) => {
    const res = c.res ? c.res[seite][i] : null;
    const markCls = res ? (res.ok ? "ok" : "bad") : "";
    return `<div class="brow ${markCls}" data-seite="${seite}" data-i="${i}">
      ${res ? `<span class="mark">${res.ok ? "✓" : "✗"}</span>` : ""}${seite === "Haben" ? `<span class="an">an</span>` : ""}
      <button class="slot konto ${r.konto ? "filled" : ""}" data-pick="konto" ${c.geprueft ? "disabled" : ""}>${r.konto ? `<span class="nr">${esc(r.konto)}</span><span class="nm">${esc(KONTO[r.konto])}</span>` : `<span class="ph">Konto wählen</span>`}</button>
      <button class="slot betrag ${r.betrag != null ? "filled" : ""}" data-pick="betrag" ${c.geprueft ? "disabled" : ""}>${r.betrag != null ? `<span class="nr">${eur(r.betrag)}</span>` : `<span class="ph">Betrag</span>`}</button>
      ${!c.geprueft && c.rows[seite].length > 1 ? `<button class="rm" data-rm aria-label="Zeile entfernen">×</button>` : ""}
    </div>${res && res.hint ? `<div class="rowhint ${res.ok ? "ok" : "bad"}" data-art="${esc(res.art)}">${esc(res.hint)}</div>` : ""}`;
  }).join("");
  return `<div class="side ${cls}" data-side="${seite}"><div class="side-h"><span class="lbl"><span class="dot"></span>${seite.toUpperCase()}</span></div>${rows}

}
function bindAufgabe() {
  $("#ende").onclick = () => { if (S.ergebnisse.length === 0 || confirm("Übung beenden und Auswertung anzeigen?")) renderAuswertung(); };
  const bf = $("#belegframe"); if (bf) bf.onclick = () => zoomBeleg(belegHtml(S.cur.a.beleg, belegSymbol(S.cur.a.text)));
  app().querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const row = b.closest(".brow"); openSheet(row.dataset.seite, +row.dataset.i, b.dataset.pick); });
  app().querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const row = b.closest(".brow"); S.cur.rows[row.dataset.seite].splice(+row.dataset.i, 1); drawKeepScroll(); });
  app().querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const s = b.dataset.add; S.cur.rows[s].push(neueZeile()); drawKeepScroll(); openSheet(s, S.cur.rows[s].length - 1, "konto"); });
  const p = $("#pruefen"); if (p) p.onclick = () => { if (bereit()) pruefen(); };
  app().querySelectorAll("[data-tipp]").forEach(b => b.onclick = naechsterTipp);
  app().querySelectorAll("#tipps details").forEach(d => d.addEventListener("toggle", () => { S.cur.tippZu[d.dataset.stufe] = !d.open; }));
  const w = $("#weiter"); if (w) w.onclick = () => { S.idx++; S.idx < S.queue.length ? renderAufgabe() : renderAuswertung(); };
}
function drawKeepScroll() { const y = window.scrollY; drawAufgabe(); window.scrollTo(0, y); }

/* ---------- Tipps (3 Stufen) ---------- */
const BULB = `<svg class="bulb" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function punkteTxt(p) { return Number.isInteger(p) ? String(p) : String(p).replace(".", ","); }
function bereit() {
  const c = S.cur; if (!c) return false;
  return ["Soll", "Haben"].every(s => c.rows[s].some(r => r.konto != null && r.betrag != null));
}
function naechsterTipp() {
  const c = S.cur; if (c.geprueft || c.tipps >= 3) return;
  c.tipps++; drawKeepScroll();
  const el = document.querySelector(`#tipps details[data-stufe="${c.tipps}"]`);
  if (el) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight - 90) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}
function tippHtml() {
  const c = S.cur, a = c.a, n = c.tipps;
  if (!n && c.geprueft) return "";
  const e = EINHEITEN.find(x => x.nr === a.einheit);
  const konten = [...new Set(a.loesung.map(l => l.konto))].sort(kontoSort);
  const st = [
    ["Tipp 1 · Denkfrage", `<p>${nbsp(esc(a.tipp || "Was passiert hier genau? Wer bekommt oder zahlt Geld?"))}</p>`],
    ["Tipp 2 · Diese Konten brauchst du", `<ul class="tkonten">${konten.map(k => `<li><b>${esc(k)}</b> ${esc(KONTO[k])}</li>`).join("")}</ul><p class="small muted">Auf welche Seite und mit welchem Betrag? Das findest du selbst heraus.</p>`],
    ["Tipp 3 · Theorie", `<ul>${(e ? e.kernsaetze : []).map(k => `<li>${esc(k)}</li>`).join("")}</ul>`]
  ];
  let h = "";
  for (let i = 0; i < n; i++) h += `<details class="tipp" data-stufe="${i + 1}" ${c.tippZu[i + 1] ? "" : "open"}><summary>${BULB}${st[i][0]}</summary><div class="tbody">${st[i][1]}</div></details>`;
  if (!c.geprueft && n < 3) h += `<button class="tippmore" data-tipp>${BULB}<span>${n === 0 ? "Tipp anzeigen" : `Nächster Tipp (${n + 1} von 3)`}</span><span class="small muted">${n === 0 ? "Richtig mit Tipp = ½ Punkt" : ""}</span></button>`;
  return h;
}

/* ---------- Auswahl-Sheet ---------- */
function openSheet(seite, i, art) {
  const c = S.cur, r = c.rows[seite][i];
  const sc = seite === "Soll" ? "s" : "h";
  let h = `<div class="grip"></div><h3><span class="${sc}">${seite}</span>, Zeile ${i + 1}: ${art === "konto" ? "Konto wählen" : "Betrag wählen"}</h3>`;
  if (art === "konto") {
    h += `<div class="klist">${c.konten.map(k => `<button class="kchip ${r.konto === k ? "cur" : ""}" data-konto="${k}"><span class="nr">${k}</span><span>${esc(KONTO[k])}</span></button>`).join("")}</div>`;
  } else {
    h += `<div class="bgrid">${c.betraege.map(v => `<button class="bchip ${r.betrag != null && cents(r.betrag) === cents(v) ? "cur" : ""}" data-betrag="${v.toFixed(2)}">${eur(v)}</button>`).join("")}</div>`;
  }
  h += `<button class="btn block ghost" id="sheetzu">Schließen</button>`;
  const sh = $("#sheet"); sh.innerHTML = h; sh.dataset.seite = seite; sh.dataset.i = i; sh.dataset.art = art;
  sh.classList.add("open"); $("#sheetbg").classList.add("open"); sh.scrollTop = 0;
  sh.querySelectorAll("[data-konto]").forEach(b => b.onclick = () => {
    r.konto = b.dataset.konto; closeSheet(); drawKeepScroll();  // Betrag wählt man separat über das Betragsfeld
  });
  sh.querySelectorAll("[data-betrag]").forEach(b => b.onclick = () => {
    r.betrag = parseFloat(b.dataset.betrag); closeSheet(); drawKeepScroll();
  });
  $("#sheetzu").onclick = closeSheet;
}
function closeSheet() { $("#sheet").classList.remove("open"); $("#sheetbg").classList.remove("open"); }

/* ---------- Prüfen ---------- */
function pruefen() {
  const c = S.cur, a = c.a;
  // leere Zeilen ignorieren, halbe Zeilen anmahnen
  for (const s of ["Soll", "Haben"]) {
    if (c.rows[s].some(r => (r.konto == null) !== (r.betrag == null))) { info("Bitte fülle in jeder Zeile Konto und Betrag aus. Oder entferne die Zeile mit ×."); return; }
  }
  for (const s of ["Soll", "Haben"]) {
    c.rows[s] = c.rows[s].filter(r => r.konto != null);
    if (!c.rows[s].length) { c.rows[s].push(neueZeile()); info(`Im ${s} steht noch nichts. Jeder Buchungssatz hat mindestens eine Soll- und eine Haben-Zeile.`); drawKeepScroll(); return; }
  }
  const res = { Soll: [], Haben: [], fehlt: {}, order: [], gesamt: "", art: "" };
  let alles = true;
  const SEITEN = ["Soll", "Haben"];
  const offen = {}, eintr = {};
  // 1. Exakte Treffer (Konto + Betrag), innerhalb einer Seite reihenfolgeunabhängig
  for (const s of SEITEN) {
    offen[s] = a.loesung.filter(l => l.seite === s).map(l => ({ ...l, used: false }));
    eintr[s] = c.rows[s].map(r => ({ r, ok: false, hint: "", art: "" }));
    eintr[s].forEach(e => { const m = offen[s].find(l => !l.used && l.konto === e.r.konto && cents(l.betrag) === cents(e.r.betrag)); if (m) { m.used = true; e.ok = true; e.match = m; } });
  }
  // 2. Hinweise für die übrigen Zeilen
  const restBetraege = SEITEN.flatMap(s => offen[s].filter(l => !l.used));   // noch nicht getroffene Lösungszeilen (beide Seiten)
  for (const s of SEITEN) {
    const anders = s === "Soll" ? "Haben" : "Soll";
    eintr[s].filter(e => !e.ok).forEach(e => {
      alles = false;
      const kontoDa = offen[s].find(l => !l.used && !l.hint && l.konto === e.r.konto);
      if (kontoDa) {
        kontoDa.hint = true;
        const gehoertWoandersHin = restBetraege.some(l => l !== kontoDa && cents(l.betrag) === cents(e.r.betrag));
        if (gehoertWoandersHin) { e.art = "vertauscht"; e.hint = "Konto stimmt, aber der Betrag gehört zu einem anderen Konto."; }
        else { e.art = "betrag"; e.hint = "Konto stimmt, aber der Betrag ist falsch. Rechne nach."; }
      } else if (a.loesung.some(l => l.seite === anders && l.konto === e.r.konto)) {
        e.art = "seite"; e.hint = "Dieses Konto gehört auf die andere Seite.";
      } else if (a.loesung.some(l => l.seite === s && l.konto === e.r.konto)) {
        e.art = "doppelt"; e.hint = "Dieses Konto hast du schon. Es kommt nur einmal vor.";
      } else if (offen[s].some(l => !l.used && cents(l.betrag) === cents(e.r.betrag))) {
        e.art = "konto"; e.hint = "Der Betrag passt, aber das Konto nicht.";
      } else {
        e.art = "falsch"; e.hint = "Dieses Konto passt hier nicht.";
      }
    });
    const rest = offen[s].filter(l => !l.used).length;
    const falsch = eintr[s].filter(e => !e.ok).length;
    if (rest > falsch) res.fehlt[s] = rest - falsch;
    if (rest > 0) alles = false;
    res[s] = eintr[s];
    // Lösungsanzeige: richtige Zeilen in der Reihenfolge des Schülers, danach die übrigen
    res.order = res.order.concat(eintr[s].filter(e => e.ok).map(e => e.match), offen[s].filter(l => !l.used));
  }
  // 3. Gesamtmeldung
  if (!alles) {
    const key = l => l.seite + "|" + l.konto;
    const schueler = SEITEN.flatMap(s => c.rows[s].map(r => ({ seite: s, konto: r.konto, betrag: r.betrag })));
    const gleich = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);
    const kontenOk = gleich(schueler.map(key).sort(), a.loesung.map(key).sort());
    const betraegeGleich = gleich(schueler.map(l => cents(l.betrag)).sort((p, q) => p - q), a.loesung.map(l => cents(l.betrag)).sort((p, q) => p - q));
    if (kontenOk && betraegeGleich) { res.art = "vertauscht"; res.gesamt = "Die Konten stimmen, aber die Beträge sind vertauscht. Schau, welcher Betrag zu welchem Konto gehört."; }
    else if (kontenOk) { res.art = "betraege"; res.gesamt = "Die Konten stimmen, aber die Beträge nicht."; }
    else { res.art = "falsch"; res.gesamt = "Noch nicht ganz richtig."; }
  }
  c.res = res; c.geprueft = true; c.ok = alles;
  // Motivation: Serie zählt nur ohne Tipp hoch; richtig mit Tipp hält die Serie, falsch setzt sie auf 0
  c.meilenstein = 0;
  if (alles) {
    c.lob = LOB[Math.floor(Math.random() * LOB.length)];
    if (!c.tipps) { S.serie++; if ([3, 5, 10].includes(S.serie) || (S.serie > 10 && S.serie % 5 === 0)) c.meilenstein = S.serie; }
  } else S.serie = 0;
  S.besteSerie = Math.max(S.besteSerie, S.serie);
  const punkte = alles ? (c.tipps > 0 ? 0.5 : 1) : 0;
  S.ergebnisse.push({ id: a.id, einheit: a.einheit, ok: alles, tipp: c.tipps > 0, tipps: c.tipps, punkte });
  merke(a.id, alles);
  drawAufgabe();
  const fb = $("#fb"); if (fb) fb.scrollIntoView({ behavior: "smooth", block: "start" });
  if (c.meilenstein) konfetti();
}
const LOB = ["Super!", "Richtig gebucht!", "Stark, weiter so!", "Sehr gut!", "Genau so!", "Sauber gebucht!", "Perfekt!", "Gut gemacht!"];
const FLAMME = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5-.5-6 1-9z" fill="currentColor"/></svg>`;
const HAKEN = `<svg class="pop" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function meilensteinText(n) {
  return n === 3 ? "3 richtig in Folge. Läuft bei dir!" : n === 5 ? "5 richtig in Folge. Richtig stark!" : n === 10 ? "10 richtig in Folge. Beeindruckend!" : `${n} richtig in Folge. Weiter so!`;
}
function konfetti() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const alt = document.getElementById("konfetti"); if (alt) alt.remove();
  const box = document.createElement("div"); box.id = "konfetti"; box.setAttribute("aria-hidden", "true");
  const farben = ["#2f6f73", "#f0b429", "#2f5fb3", "#a4572a", "#1f8a4c", "#d9a3c4"];
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = farben[i % farben.length];
    p.style.animationDelay = Math.random() * 0.35 + "s";
    p.style.animationDuration = 1.3 + Math.random() * 0.9 + "s";
    p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    if (i % 3 === 0) p.style.borderRadius = "50%";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2600);
}
function info(t) { const fb = $("#fb"); if (fb) { fb.innerHTML = `<div class="msg info">${esc(t)}</div>`; } }
function loesungHtml(a, order) {
  const z = l => `<div class="lz ${l.seite === "Soll" ? "s" : "h"}">${l.seite === "Haben" ? `<span class="an">an</span>` : ""}<span class="kt"><b>${esc(l.konto)}</b> ${esc(KONTO[l.konto] || "")}</span><span class="bt">${eur(l.betrag)}</span></div>`;
  const L = order && order.length === a.loesung.length ? order : a.loesung;
  return L.filter(l => l.seite === "Soll").map(z).join("") + L.filter(l => l.seite === "Haben").map(z).join("");
}
function feedbackHtml() {
  const c = S.cur;
  return `<div class="msg ${c.ok ? "ok" : "bad"}" id="ergebnis" data-ok="${c.ok}" data-art="${c.ok ? "" : esc(c.res.art)}">${c.ok ? `<span class="lobzeile">${HAKEN}<span><b>${esc(c.lob || "Richtig!")}</b> ${c.tipps ? "Mit Tipp gelöst: ½ Punkt." : "1 Punkt."}</span></span>` : `${esc(c.res.gesamt)}<div class="mut">Kein Problem, schau dir die Lösung an.</div>`}</div>
    ${c.ok && c.meilenstein ? `<div class="meilenstein" id="meilenstein">${FLAMME}<span>${esc(meilensteinText(c.meilenstein))}</span></div>` : ""}
    <div class="loesung"><div style="font-weight:700;margin-bottom:6px">Lösung</div>${loesungHtml(c.a, c.res && c.res.order)}</div>
    <div class="erkl"><b>Erklärung:</b> ${esc(c.a.erklaerung)}</div>`;
}

/* ---------- Auswertung ---------- */
function renderAuswertung() {
  window.scrollTo(0, 0);
  const E = S.ergebnisse, ok = E.filter(r => r.ok).length, pk = E.reduce((s, r) => s + r.punkte, 0), mitT = E.filter(r => r.ok && r.tipp).length;
  const falsche = E.filter(r => !r.ok).map(r => r.id);
  let h = `<div class="card" id="auswertung" style="text-align:center"><div class="muted">Deine Auswertung</div>
    <div class="big">${punkteTxt(pk)} von ${E.length} Punkten</div><div class="small muted" style="margin:2px 0 6px">${ok} richtig${mitT ? `, davon ${mitT} mit Tipp (je ½ Punkt)` : ""}</div>${S.besteSerie >= 2 ? `<div class="beste" id="beste" data-beste="${S.besteSerie}">${FLAMME}<span>Beste Serie: ${S.besteSerie} richtig in Folge</span></div>` : `<div id="beste" data-beste="${S.besteSerie}" hidden></div>`}<div class="muted">${E.length ? (pk === E.length ? "Alles richtig, ganz ohne Tipp. Ausgezeichnet!" : ok === E.length ? "Alles richtig! Nächstes Mal vielleicht ohne Tipp?" : ok / E.length >= .7 ? "Sehr gut, fast alles richtig!" : "Weiter üben. Du schaffst das!") : "Noch keine Aufgabe bearbeitet."}</div></div>`;
  if (E.length) {
    h += `<div class="card"><div style="font-weight:700">Nach Einheiten</div>`;
    EINHEITEN.forEach(e => {
      const x = E.filter(r => r.einheit === e.nr); if (!x.length) return;
      const o = x.filter(r => r.ok).length, t = x.filter(r => r.ok && r.tipp).length, p = x.reduce((s, r) => s + r.punkte, 0);
      h += `<div class="ubar" data-einheit="${e.nr}"><div class="t">Einheit ${e.nr}: ${esc(e.titel)}<div class="meter"><i style="width:${p / x.length * 100}%"></i></div>
        <div class="small muted">${o} von ${x.length} richtig${t ? ` · davon <b class="mittipp">${t}</b> mit Tipp` : " · ohne Tipp"}</div></div><div class="v">${punkteTxt(p)}/${x.length}</div></div>`;
    });
    h += `</div>`;
  }
  h += `<div class="sticky"><div class="inner">${falsche.length ? `<button class="btn primary" id="nochmal">Falsche nochmal üben (${falsche.length})</button>` : ""}<button class="btn ${falsche.length ? "" : "primary"}" id="home">Zur Übersicht</button></div></div>`;
  app().innerHTML = h;
  const n = $("#nochmal"); if (n) n.onclick = () => starte(falsche);
  $("#home").onclick = renderStart;
}

/* ---------- Start ---------- */
function init() {
  document.title = CONFIG.titel + (CONFIG.klasse ? " – " + CONFIG.klasse : "");
  $("#titel").textContent = CONFIG.titel;
  const sub = [CONFIG.untertitel, CONFIG.klasse ? "Klasse " + CONFIG.klasse : "", CONFIG.lehrer].filter(Boolean).join(" · ");
  $("#untertitel").textContent = sub; $("#untertitel").hidden = !sub;
  $("#sheetbg").onclick = closeSheet;
  $("#zoom").onclick = ev => { if (ev.target.id === "zoom" || ev.target.classList.contains("zclose")) $("#zoom").classList.remove("open"); };
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") { closeSheet(); $("#zoom").classList.remove("open"); } });
  renderStart();
}
window.BT = { DATA, S, kontenFuer, betraegeFuer, belegHtml, eur, starte };
init();

</script>
</body>
</html>
